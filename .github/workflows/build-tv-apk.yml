name: Build Lityra TV APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-tv/**'
      - '.github/workflows/build-tv-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Compilar APK
        working-directory: android-tv
        run: gradle --no-daemon assembleRelease
      - name: Renomear
        run: cp android-tv/app/build/outputs/apk/release/app-release.apk Lityra-TV.apk
      - uses: actions/upload-artifact@v4
        with: { name: Lityra-TV, path: Lityra-TV.apk }
      - name: Publicar em Releases (tv-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-latest
          name: Lityra TV (APK)
          body: APK do Lityra para Android TV. O app abre o site publicado, então as atualizações do Lityra chegam sozinhas.
          files: Lityra-TV.apk
          make_latest: false
