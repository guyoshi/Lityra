plugins { id 'com.android.application' }

android {
    namespace 'app.lityra.tv'
    compileSdk 34
    defaultConfig {
        applicationId 'app.lityra.tv'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        lityra {
            storeFile file('lityra-tv.keystore')
            storePassword 'lityratv'
            keyAlias 'lityra'
            keyPassword 'lityratv'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.lityra
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
